<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Tiny Container Camera test</title>
  <style>
    body { font: 14px sans-serif; padding: 12px; }
    video { width: 480px; max-width: 100%; background: #000; }
    pre { background: #f3f3f3; padding: 8px; }
  </style>
</head>
<body>
  <h1>Tiny Container Camera test</h1>
  <p><button id="start">Start camera</button> <button id="stop">Stop</button></p>
  <video id="v" autoplay muted playsinline></video>
  <pre id="log"></pre>
  <script>
    const log = (s) => { document.getElementById('log').textContent += s + '\n'; };
    let stream = null;
    document.getElementById('start').onclick = async () => {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        log('devices: ' + JSON.stringify(devices.filter((d) => d.kind === 'videoinput')));
        stream = await navigator.mediaDevices.getUserMedia({ video: true });
        const t = stream.getVideoTracks()[0];
        log('track: ' + t.label + ' ' + JSON.stringify(t.getSettings()));
        document.getElementById('v').srcObject = stream;
      } catch (e) {
        log('error: ' + e.name + ': ' + e.message);
      }
    };
    document.getElementById('stop').onclick = () => {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      log('stopped');
    };
  </script>
</body>
</html>
