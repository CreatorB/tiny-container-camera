<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Camera permission</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --fg: #1f2430; --muted: #6b7280; --accent: #0b7285; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1f2430; --fg: #e6e6e6; --muted: #8a9199; --accent: #5ccfe6; }
    }
    body { margin: 0; padding: 20px; font: 14px system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    header { display: flex; align-items: center; gap: 10px; }
    header img { width: 32px; height: 32px; }
    h1 { font-size: 16px; margin: 0; }
    #origin { font-weight: 700; word-break: break-all; }
    p { color: var(--muted); }
    .buttons { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    button { padding: 6px 16px; font: inherit; cursor: pointer; }
    #allow { background: var(--accent); color: var(--bg); border: 0; border-radius: 4px; font-weight: 600; }
  </style>
</head>
<body>
  <header><img src="icons/icon-48.png" alt=""><h1>Allow camera access?</h1></header>
  <p><span id="origin"></span> wants to use the Android camera.</p>
  <p>You can change this later on the extension's options page.</p>
  <div class="buttons">
    <button id="block">Block</button>
    <button id="allow">Allow</button>
  </div>
  <script src="prompt.js"></script>
</body>
</html>
